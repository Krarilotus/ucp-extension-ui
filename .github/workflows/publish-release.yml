name: Publish release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: UnofficialCrusaderPatch/UnofficialCrusaderPatch3
          ref: 02a7a6bc8ab956a91fc752e8c8ed215c149855e7
          path: framework-reference
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install lupa==2.6
      - run: python -m unittest discover -s tests
        env:
          UCP_FRAMEWORK_PROXIES: framework-reference/content/ucp/code/extensions/proxies.lua
      - run: python tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: ui-test-build
          path: dist/*
  publish:
    if: github.event_name != 'pull_request' && github.repository == 'Krarilotus/ucp-extension-ui'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ui-test-build
          path: dist
      - name: Publish exact-commit test ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          tag="test-${BUILD_SHA:0:12}"
          printf 'Test build of commit %s. Includes the installable ZIP and SHA-256 checksum.\n' "$BUILD_SHA" > notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --target "$BUILD_SHA" --prerelease --title "UI test build ${BUILD_SHA:0:12}" --notes-file notes.md
          fi
